const files=["part-01.bin", "part-02.bin", "part-03.bin", "part-04.bin", "part-05.bin", "part-06.bin", "part-07.bin", "part-08.bin", "part-09.bin", "part-10.bin", "part-11.bin"];

}catch(error){status.textContent='No se ha podido preparar el PDF. Inténtalo de nuevo.';progress.hidden=true;retry.hidden=false;}}
